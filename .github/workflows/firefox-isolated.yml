name: Isolated Firefox integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Firefox test harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
      - name: Run synthetic Firefox browser scenarios
        run: node tests/firefox-isolated.mjs

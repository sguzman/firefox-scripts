name: Firefox scripts safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog and scripts
        run: node tools/check.mjs
      - name: Run safety unit tests
        run: node --test
